name: publish-plugin

on:
  workflow_dispatch:
  push:
    branches: [publish-usage-1000-1-22]
    paths: ['.github/workflows/publish-plugin.yml']

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    env:
      WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2658f454f18663e52a110cc72f468162bebba0c1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify source versions match
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          CONFIG_VERSION="$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" src/pluginConfig.ts | head -n 1)"
          echo "package.json:     ${PACKAGE_VERSION}"
          echo "pluginConfig.ts: ${CONFIG_VERSION}"
          test -n "$CONFIG_VERSION"
          test "$PACKAGE_VERSION" = "$CONFIG_VERSION"

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Verify packaged plugin version
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          BUILT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('dist/plugin.json','utf8')).version")"
          echo "Publishing version ${BUILT_VERSION}"
          test "$PACKAGE_VERSION" = "$BUILT_VERSION"

      - name: Publish plugin
        run: |
          if [ -z "$WINDY_API_KEY" ]; then
            echo "Secret WINDY_API_KEY is not configured" >&2
            exit 1
          fi

          cd dist
          echo "Creating plugin archive..."
          echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"2658f454f18663e52a110cc72f468162bebba0c1\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
          mv plugin.json /tmp/plugin.json
          jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
          tar --exclude='*.map' -cf ../plugin.tar .

          echo "Publishing plugin..."
          curl -s --fail-with-body \
            -X POST 'https://node.windy.com/plugins/v1.0/upload' \
            -H "x-windy-api-key: ${WINDY_API_KEY}" \
            -F "plugin_archive=@../plugin.tar"

          echo

      - name: Verify public plugin bundle
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 'https://windy-plugins.com/458307/windy-plugin-snowline-map-100m/1000.1.22/plugin.min.js' -o /tmp/wintry-published.js
          node --check /tmp/wintry-published.js
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('/tmp/wintry-published.js','utf8');for(const t of ['1000.1.22','wintry-raster-tile','Atmospheric layer count','above terrain','ptype'])if(!s.includes(t))throw new Error('Missing '+t);console.log('Verified public 1000.1.22',s.length,'bytes');"
