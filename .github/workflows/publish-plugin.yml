name: publish-plugin

on:
  workflow_dispatch:
  push:
    branches: [publish-core-wintry-1000-1-15]
    paths: ['.github/workflows/publish-plugin.yml']

jobs:
  publish-plugin:
    runs-on: ubuntu-latest
    env:
      WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 880d252ded1f4bfbc0f97177c8254a10444932c9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify source versions match
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          CONFIG_VERSION="$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" src/pluginConfig.ts | head -n 1)"
          echo "package.json:     ${PACKAGE_VERSION}"
          echo "pluginConfig.ts: ${CONFIG_VERSION}"
          test -n "$CONFIG_VERSION"
          test "$PACKAGE_VERSION" = "$CONFIG_VERSION"

      - name: Install and build
        run: |
          npm install
          npm run build

      - name: Verify packaged plugin version
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          BUILT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('dist/plugin.json','utf8')).version")"
          echo "Publishing version ${BUILT_VERSION}"
          test "$PACKAGE_VERSION" = "$BUILT_VERSION"

      - name: Publish plugin
        run: |
          if [ -z "$WINDY_API_KEY" ]; then
            echo "Secret WINDY_API_KEY is not configured" >&2
            exit 1
          fi

          cd dist
          echo "Creating plugin archive..."
          echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"880d252ded1f4bfbc0f97177c8254a10444932c9\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
          mv plugin.json /tmp/plugin.json
          jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
          tar --exclude='*.map' -cf ../plugin.tar .

          echo "Publishing plugin..."
          curl -s --fail-with-body \
            -X POST 'https://node.windy.com/plugins/v1.0/upload' \
            -H "x-windy-api-key: ${WINDY_API_KEY}" \
            -F "plugin_archive=@../plugin.tar"


      - name: Verify public core plugin
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 30 'https://windy-plugins.com/458307/windy-plugin-snowline-map-100m/1000.1.15/plugin.min.js' -o /tmp/core-plugin.js
          node --check /tmp/core-plugin.js
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const source=readFileSync('/tmp/core-plugin.js','utf8');
          assert.ok(source.includes('1000.1.15'));
          assert.ok(source.includes('SNOWLINE'));
          assert.ok(source.includes('PRECIPITATION TYPE'));
          assert.ok(!/SNOWFALL TOTAL|Snowfall so far|remaining layer|Experimental settling|Gross snowfall estimate|Limited atmospheric detail/i.test(source));
          console.log('Public core plugin verified',source.length,'bytes');
          NODE
