name: published-1000.1.9-thorough-qa

on:
  push:
    branches: [qa-published-1000.1.9-thorough]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify source versions match
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          CONFIG_VERSION="$(sed -n "s/.*version: '\([^']*\)'.*/\1/p" src/pluginConfig.ts | head -n 1)"
          echo "package.json:     ${PACKAGE_VERSION}"
          echo "pluginConfig.ts: ${CONFIG_VERSION}"
          test -n "$CONFIG_VERSION"
          test "$PACKAGE_VERSION" = "$CONFIG_VERSION"

      - name: Install dependencies
        run: npm install

      - name: Test terrain-aware WBZ
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Test streaming MP4 and shading pixels
        run: node test/map-export-browser.mjs

      - name: Download the official published plugin
        run: |
          curl --fail --location --retry 2 https://windy-plugins.com/458307/windy-plugin-snowline-map-100m/1000.1.9/plugin.min.js -o dist/released.js
          node --check dist/released.js
          sha256sum dist/released.js
      - name: Test the published plugin on desktop and mobile
        run: node test/windy-published-qa.mjs

      - name: Independently decode exported video
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames,duration -of json test-output/wintry-live.mp4 > test-output/video-info.json
          ffmpeg -hide_banner -loglevel error -i test-output/wintry-live.mp4 -frames:v 1 test-output/windy-mp4-first-frame.png
          ffmpeg -hide_banner -loglevel error -ss 14 -i test-output/wintry-live.mp4 -frames:v 1 test-output/windy-mp4-middle-frame.png
          ffmpeg -hide_banner -i test-output/wintry-live.mp4 -vf 'blackdetect=d=0.1:pix_th=0.02' -f null - 2> test-output/video-decode.log
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const video=JSON.parse(readFileSync('test-output/video-info.json')).streams[0];
          assert.equal(video.codec_name,'h264');assert.ok(Number(video.nb_frames)>100);
          assert.ok(Math.max(video.width,video.height)<=1280);
          assert.ok(!readFileSync('test-output/video-decode.log','utf8').includes('black_start:'));
          console.log('Independent full-file video decode passed',video);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wintry-shading-browser
          path: |
            test-output/*.png
            test-output/*.mp4
            test-output/*.json
            test-output/*.log
          if-no-files-found: ignore

      - name: Verify packaged plugin version
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          BUILT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('dist/plugin.json','utf8')).version")"
          echo "package.json:    ${PACKAGE_VERSION}"
          echo "dist/plugin.json: ${BUILT_VERSION}"
          test "$PACKAGE_VERSION" = "$BUILT_VERSION"

  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          mkdir -p dist
          curl --fail --location --retry 2 https://windy-plugins.com/458307/windy-plugin-snowline-map-100m/1000.1.9/plugin.min.js -o dist/released.js
          sha256sum dist/released.js
      - name: Test published plugin geography, failures and lifecycle
        run: node test/windy-robustness-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-robustness
          path: test-output/
